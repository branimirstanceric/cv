<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Branimir Stančerić | Delivery Manager | Case Studies</title>
  <meta name="description" content="Case studies by Branimir Stančerić, Delivery Manager and IT Project Manager focused on eCommerce, integrations, and predictable delivery." />
  <meta property="og:title" content="Branimir Stančerić | Delivery Manager" />
  <meta property="og:description" content="Case studies in eCommerce delivery, integrations, and platform migrations." />
  <meta property="og:image" content="https://branimirstanceric.github.io/cv/assets/profile.jpg" />

  <!-- Apply the saved or system theme before first paint -->
  <script>
    (function(){
      var t = null;
      try { t = localStorage.getItem('theme'); } catch(e) {}
      if(t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{
      --bg: #f7f6f2;
      --paper: #ffffff;
      --sunken: #efede7;
      --ink: #15181f;
      --muted: #5c6370;
      --faint: #8a909b;
      --hair: #e4e1d9;

      --accent: #3446c4;
      --accent-ink: #ffffff;
      --accent-soft: #e9ecfb;
      --good: #1f8a5b;

      --shadow: 0 1px 2px rgba(20,22,30,0.04), 0 8px 24px rgba(20,22,30,0.06);
      --r-lg: 18px;
      --r-md: 12px;
      --r-pill: 999px;

      --serif: "Fraunces", Georgia, "Times New Roman", serif;
      --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --t: 160ms ease-out;
    }

    [data-theme="dark"]{
      --bg: #0f1115;
      --paper: #171a20;
      --sunken: #13161b;
      --ink: #eceef2;
      --muted: #a2a8b3;
      --faint: #767d89;
      --hair: #272b33;

      --accent: #8fa0ff;
      --accent-ink: #0f1115;
      --accent-soft: #1d2340;
      --good: #4cc38a;

      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.25);
    }

    *{ box-sizing: border-box; margin: 0; padding: 0; }
    html{ scroll-behavior: smooth; scroll-padding-top: 76px; }
    body{
      font-family: var(--sans);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a{ color: inherit; }
    button{ font: inherit; color: inherit; }
    :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

    .container{
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px;
    }
    @media (max-width: 600px){ .container{ padding: 0 16px; } }

    /* Top bar */
    .topbar{
      position: sticky;
      top: 0;
      z-index: 50;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--hair);
    }
    .topbar-inner{
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand{
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.05rem;
      text-decoration: none;
      white-space: nowrap;
    }
    .nav{
      display: flex;
      gap: 4px;
      font-size: 0.92rem;
    }
    .nav a{
      text-decoration: none;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: var(--r-pill);
      transition: color var(--t), background-color var(--t);
    }
    .nav a:hover{ color: var(--ink); background: var(--sunken); }
    @media (max-width: 760px){ .nav{ display: none; } }

    .theme-btn{
      border: 1px solid var(--hair);
      background: var(--paper);
      border-radius: var(--r-pill);
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background-color var(--t);
    }
    .theme-btn:hover{ background: var(--sunken); }
    .theme-btn svg{ width: 18px; height: 18px; }
    [data-theme="dark"] .icon-moon, [data-theme="light"] .icon-sun{ display: none; }

    /* Buttons */
    .btn{
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: var(--r-pill);
      font-weight: 600;
      font-size: 0.94rem;
      text-decoration: none;
      border: 1px solid var(--hair);
      background: var(--paper);
      transition: transform 120ms ease-out, background-color var(--t), border-color var(--t);
    }
    .btn:hover{ transform: translateY(-1px); border-color: var(--faint); }
    .btn.primary{
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }
    .btn.primary:hover{ border-color: var(--accent); filter: brightness(1.08); }

    /* Hero */
    .hero{
      padding: 64px 0 48px;
    }
    .hero-grid{
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 56px;
      align-items: start;
    }
    @media (max-width: 860px){
      .hero{ padding: 40px 0 32px; }
      .hero-grid{ grid-template-columns: minmax(0, 1fr); gap: 32px; }
    }
    .kicker{
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .dot{
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--good);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 20%, transparent);
    }
    .hero-title{
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(2.1rem, 4.6vw, 3.4rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
      text-wrap: balance;
    }
    .hero-title .accent{
      color: var(--accent);
      font-style: italic;
    }
    .hero-intro{
      font-size: 1.1rem;
      color: var(--muted);
      max-width: 62ch;
      margin-bottom: 28px;
    }
    .hero-actions{
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 28px;
    }
    .hero-facts{
      display: flex;
      flex-wrap: wrap;
      gap: 8px 24px;
      font-size: 0.92rem;
      color: var(--muted);
    }
    .hero-facts strong{ color: var(--ink); font-weight: 600; }

    .profile-card{
      background: var(--paper);
      border: 1px solid var(--hair);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow);
      padding: 20px;
    }
    .avatar{
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--r-md);
      overflow: hidden;
      background: var(--sunken);
      margin-bottom: 16px;
      display: grid;
      place-items: center;
      color: var(--faint);
      font-size: 0.85rem;
    }
    .avatar img{ width: 100%; height: 100%; object-fit: cover; display: block; }
    .profile-name{
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.25rem;
      line-height: 1.2;
    }
    .profile-role{
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 2px;
    }
    .badges{
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
    }
    .facts{
      margin-top: 16px;
      border-top: 1px solid var(--hair);
      padding-top: 12px;
      display: grid;
      gap: 6px;
      font-size: 0.88rem;
    }
    .facts div{ display: flex; justify-content: space-between; gap: 12px; }
    .facts dt{ color: var(--faint); }
    .facts dd{ text-align: right; }
    @media (max-width: 860px){
      .profile-card{ display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 0 16px; align-items: center; }
      .avatar{ margin-bottom: 0; grid-row: span 2; }
      .badges, .facts{ grid-column: 1 / -1; }
    }

    .pill{
      display: inline-block;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: var(--r-pill);
      background: var(--sunken);
      color: var(--muted);
      white-space: nowrap;
    }

    /* Results strip */
    .results{
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      border-top: 1px solid var(--hair);
      border-bottom: 1px solid var(--hair);
    }
    .result{
      padding: 24px 24px 24px 0;
    }
    .result + .result{ padding-left: 24px; border-left: 1px solid var(--hair); }
    @media (max-width: 720px){
      .result, .result + .result{ padding: 18px 0; border-left: 0; }
      .result + .result{ border-top: 1px solid var(--hair); }
    }
    .result-num{
      font-family: var(--serif);
      font-size: 2.6rem;
      line-height: 1;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .result-text{ font-size: 0.92rem; color: var(--muted); }
    .result-text strong{ color: var(--ink); font-weight: 600; display: block; }

    /* Sections */
    .section{ padding: 72px 0 0; }
    @media (max-width: 600px){ .section{ padding-top: 52px; } }
    .section-head{
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .eyebrow{
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .section-title{
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(1.7rem, 3vw, 2.2rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    /* Filters */
    .toolbar{
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }
    .search{
      flex: 0 1 280px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--paper);
      border: 1px solid var(--hair);
      border-radius: var(--r-pill);
      padding: 8px 14px;
      color: var(--faint);
    }
    .search:focus-within{ border-color: var(--accent); }
    .search svg{ width: 16px; height: 16px; flex: none; }
    .search input{
      border: 0;
      outline: 0;
      background: transparent;
      width: 100%;
      font: inherit;
      font-size: 0.92rem;
      color: var(--ink);
    }
    .chips{ display: flex; flex-wrap: wrap; gap: 6px; }
    .chip{
      border: 1px solid var(--hair);
      background: transparent;
      color: var(--muted);
      border-radius: var(--r-pill);
      padding: 7px 14px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background-color var(--t), color var(--t), border-color var(--t);
    }
    .chip:hover{ color: var(--ink); border-color: var(--faint); }
    .chip.active{
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bg);
    }
    .count{ font-size: 0.88rem; color: var(--faint); margin-left: auto; }

    /* Case studies */
    .feed{ display: grid; gap: 14px; }
    .case{
      background: var(--paper);
      border: 1px solid var(--hair);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: border-color var(--t);
    }
    .case:hover{ border-color: color-mix(in srgb, var(--hair) 50%, var(--faint)); }
    .case > summary{
      list-style: none;
      cursor: pointer;
      padding: 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 210px;
      gap: 24px;
    }
    .case > summary::-webkit-details-marker{ display: none; }
    .case-meta{
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 12px;
      font-size: 0.85rem;
      color: var(--faint);
      margin-bottom: 8px;
    }
    .case-meta .company{ color: var(--ink); font-weight: 600; }
    .ongoing{
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--good);
      font-weight: 600;
    }
    .ongoing::before{
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .case-title{
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.35rem;
      line-height: 1.25;
      margin-bottom: 6px;
    }
    .case-summary{ color: var(--muted); }
    .case-context{ color: var(--faint); font-size: 0.88rem; margin-top: 6px; }
    .case-tags{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .case-more{
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
    }
    .case-more svg{ width: 16px; height: 16px; transition: transform var(--t); }
    .case[open] .case-more svg{ transform: rotate(180deg); }
    .case[open] .more-label::after{ content: "Hide details"; }
    .case:not([open]) .more-label::after{ content: "Read the case study"; }

    .case-stat{
      border-left: 1px solid var(--hair);
      padding-left: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .case-stat .num{
      font-family: var(--serif);
      font-size: 2.6rem;
      line-height: 1;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .case-stat .txt{ font-size: 0.88rem; color: var(--muted); }
    .case-stat.pending .txt{ color: var(--faint); font-style: italic; }
    @media (max-width: 720px){
      .case > summary{ grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 20px; }
      .case-stat{ border-left: 0; border-top: 1px solid var(--hair); padding: 16px 0 0; }
      .case-stat .num{ font-size: 2.1rem; }
    }

    .case-body{
      border-top: 1px solid var(--hair);
      background: var(--sunken);
      padding: 28px 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 40px;
    }
    @media (max-width: 720px){
      .case-body{ grid-template-columns: minmax(0, 1fr); gap: 24px; padding: 22px 20px; }
    }
    .story{ display: grid; gap: 20px; max-width: 64ch; }
    .story h4, .aside h4{
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--faint);
      margin-bottom: 6px;
    }
    .story p{ color: var(--ink); }
    .aside{
      display: grid;
      gap: 20px;
      align-content: start;
    }
    .aside ul{ list-style: none; display: grid; gap: 8px; }
    .aside li{
      position: relative;
      padding-left: 18px;
      font-size: 0.92rem;
    }
    .aside li::before{
      content: "";
      position: absolute;
      left: 0;
      top: 0.62em;
      width: 8px;
      height: 2px;
      background: var(--accent);
    }
    .empty{
      padding: 32px;
      text-align: center;
      color: var(--faint);
      border: 1px dashed var(--hair);
      border-radius: var(--r-lg);
    }

    /* Capabilities */
    .caps{
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 48px;
    }
    @media (max-width: 720px){ .caps{ grid-template-columns: minmax(0, 1fr); } }
    .cap{
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      padding: 22px 0;
      border-top: 1px solid var(--hair);
    }
    .cap-num{
      font-family: var(--serif);
      color: var(--accent);
      font-size: 1.1rem;
    }
    .cap h3{ font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
    .cap p{ color: var(--muted); font-size: 0.95rem; }

    .tools{ display: flex; flex-wrap: wrap; gap: 8px; }
    .tools .pill{
      font-size: 0.9rem;
      padding: 7px 14px;
      background: var(--paper);
      border: 1px solid var(--hair);
      color: var(--ink);
    }

    /* Contact */
    .contact{
      margin-top: 88px;
      background: var(--ink);
      color: var(--bg);
      border-radius: 24px;
      padding: 56px 48px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 32px;
      align-items: end;
    }
    .contact .section-title{ color: var(--bg); margin-bottom: 10px; }
    .contact p{ color: color-mix(in srgb, var(--bg) 70%, var(--ink)); max-width: 52ch; }
    .contact .eyebrow{ color: color-mix(in srgb, var(--accent) 60%, var(--bg)); }
    .contact-links{ display: flex; flex-wrap: wrap; gap: 10px; }
    .contact .btn{
      background: transparent;
      color: var(--bg);
      border-color: color-mix(in srgb, var(--bg) 30%, var(--ink));
    }
    .contact .btn.primary{ background: var(--bg); color: var(--ink); border-color: var(--bg); }
    @media (max-width: 760px){
      .contact{ grid-template-columns: minmax(0, 1fr); padding: 36px 24px; margin-top: 64px; }
    }

    footer{
      padding: 32px 0 40px;
      color: var(--faint);
      font-size: 0.85rem;
      text-align: center;
    }

    .load-error{
      padding: 16px;
      border: 1px dashed var(--hair);
      border-radius: var(--r-md);
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce){
      html{ scroll-behavior: auto; }
      *{ transition: none !important; }
    }
  </style>
</head>

<body>
  <!--
    All text on this page lives in the content/ folder:
      content/profile.json       name, intro, contact details
      content/case-studies.json  case studies
      content/skills.json        capabilities and tooling
    Edit it through Pages CMS (app.pagescms.org) or directly in those files.
  -->
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="#top" data-field="name">Branimir Stančerić</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="#cases">Case studies</a>
        <a href="#capabilities">Capabilities</a>
        <a href="#tooling">Tooling</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch light or dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="top">
    <!-- Hero -->
    <section class="hero">
      <div class="container hero-grid">
        <div>
          <div class="kicker"><span class="dot"></span><span data-field="status_line"></span></div>
          <h1 class="hero-title" id="hero-title"></h1>
          <p class="hero-intro" data-field="hero_intro"></p>
          <div class="hero-actions">
            <a class="btn primary" href="#cases">View case studies</a>
            <a class="btn" id="cv-link" href="assets/cv.pdf" target="_blank" rel="noreferrer">Download CV</a>
          </div>
          <div class="hero-facts" id="hero-facts"></div>
        </div>

        <aside class="profile-card" aria-label="Profile">
          <div class="avatar" id="avatar"></div>
          <div>
            <div class="profile-name" data-field="name"></div>
            <div class="profile-role" data-field="headline"></div>
          </div>
          <div class="badges" id="badges"></div>
          <dl class="facts" id="quick-facts"></dl>
        </aside>
      </div>
    </section>

    <!-- Key results, taken from case studies that have a number in "Key result" -->
    <div class="container">
      <div class="results" id="results" aria-label="Key results"></div>
    </div>

    <!-- Case studies -->
    <section class="section" id="cases">
      <div class="container">
        <div class="section-head">
          <div>
            <div class="eyebrow">Selected work</div>
            <h2 class="section-title">Case studies</h2>
          </div>
        </div>

        <div class="toolbar">
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="Search case studies" aria-label="Search case studies" />
          </label>
          <div class="chips" id="filters" role="group" aria-label="Filter by category"></div>
          <div class="count" aria-live="polite"><span id="count">0</span> shown</div>
        </div>

        <div class="feed" id="feed"></div>
      </div>
    </section>

    <!-- Capabilities -->
    <section class="section" id="capabilities">
      <div class="container">
        <div class="section-head">
          <div>
            <div class="eyebrow">How I work</div>
            <h2 class="section-title">Capabilities</h2>
          </div>
        </div>
        <div class="caps" id="capability-list"></div>
      </div>
    </section>

    <!-- Tooling -->
    <section class="section" id="tooling">
      <div class="container">
        <div class="section-head">
          <div>
            <div class="eyebrow">Day to day</div>
            <h2 class="section-title">Tools and methods</h2>
          </div>
        </div>
        <div class="tools" id="tool-list"></div>
      </div>
    </section>

    <!-- Contact -->
    <div class="container">
      <section class="contact" id="contact">
        <div>
          <div class="eyebrow">Contact</div>
          <h2 class="section-title">Let's talk about your next delivery.</h2>
          <p data-field="contact_intro"></p>
        </div>
        <div class="contact-links" id="contact-list"></div>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">© <span id="year"></span> <span data-field="name"></span></div>
  </footer>

  <script>
    (function(){
      // Theme toggle (initial theme is set in <head>)
      document.getElementById('theme-btn').addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch(e) {}
      });

      document.getElementById('year').textContent = new Date().getFullYear();

      // Small DOM helper: el('div', {class:'x'}, 'text', childNode, ...)
      function el(tag, attrs, ...children){
        const node = document.createElement(tag);
        Object.entries(attrs || {}).forEach(([k, v]) => {
          if(v !== undefined && v !== null && v !== '') node.setAttribute(k, v);
        });
        children.flat().forEach(c => {
          if(c === undefined || c === null || c === '') return;
          node.append(c instanceof Node ? c : String(c));
        });
        return node;
      }

      // Pages CMS may store media paths with a leading slash; the site lives under /cv/, so keep them relative.
      function asset(path){
        return (path || '').replace(/^\/+/, '');
      }

      function list(value){
        return Array.isArray(value) ? value.filter(Boolean) : [];
      }

      // Pulls the headline number out of a key result, e.g. "Reduced ... by over 70%." -> "70%"
      function statOf(text){
        const m = (text || '').match(/\d+(?:[.,]\d+)?\s?(?:%|x\b)|\d+\+/i);
        return m ? m[0].replace(/\s/g, '') : '';
      }

      async function load(path){
        const res = await fetch(path, { cache: 'no-cache' });
        if(!res.ok) throw new Error(path + ': ' + res.status);
        return res.json();
      }

      function renderProfile(p){
        document.querySelectorAll('[data-field]').forEach(node => {
          const value = p[node.getAttribute('data-field')];
          if(typeof value === 'string') node.textContent = value;
        });

        const avatar = document.getElementById('avatar');
        if(p.photo){
          const img = el('img', { src: asset(p.photo), alt: p.name });
          img.addEventListener('error', () => avatar.replaceChildren('Photo not found'));
          avatar.append(img);
        }

        if(p.cv_file) document.getElementById('cv-link').setAttribute('href', asset(p.cv_file));

        document.getElementById('badges').append(
          ...list(p.badges).map(b => el('span', { class: 'pill' }, b))
        );

        document.getElementById('quick-facts').append(
          ...list(p.quick_facts).map(f => el('div', {}, el('dt', {}, f.label), el('dd', {}, f.value)))
        );

        // Hero title with the highlighted phrase in accent colour
        const title = document.getElementById('hero-title');
        const text = p.hero_title || '';
        const hl = p.hero_highlight || '';
        const at = hl ? text.indexOf(hl) : -1;
        if(at >= 0){
          title.append(text.slice(0, at), el('span', { class: 'accent' }, hl), text.slice(at + hl.length));
        } else {
          title.textContent = text;
        }

        document.getElementById('hero-facts').append(
          ...list(p.hero_facts).map(f => el('span', {}, el('strong', {}, f.label), ' ' + f.value))
        );

        const contacts = [];
        if(p.email) contacts.push(el('a', { class: 'btn primary', href: 'mailto:' + p.email }, 'Email me'));
        if(p.linkedin) contacts.push(el('a', { class: 'btn', href: p.linkedin, target: '_blank', rel: 'noreferrer' }, 'LinkedIn'));
        if(p.github) contacts.push(el('a', { class: 'btn', href: p.github, target: '_blank', rel: 'noreferrer' }, 'GitHub'));
        if(p.cv_file) contacts.push(el('a', { class: 'btn', href: asset(p.cv_file), target: '_blank', rel: 'noreferrer' }, 'CV (PDF)'));
        document.getElementById('contact-list').append(...contacts);
      }

      const chevron = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';

      function renderCase(c){
        const roles = list(c.my_role);
        const ongoing = /ongoing|present|now/i.test(c.period || '');
        const stat = statOf(c.impact);

        const more = el('span', { class: 'case-more' }, el('span', { class: 'more-label' }));
        more.insertAdjacentHTML('beforeend', chevron);

        let statBlock;
        if(c.impact){
          statBlock = el('div', { class: 'case-stat' },
            stat ? el('div', { class: 'num' }, stat) : null,
            el('div', { class: 'txt' }, c.impact)
          );
        } else {
          statBlock = el('div', { class: 'case-stat pending' },
            el('div', { class: 'txt' }, ongoing ? 'In progress: results to follow.' : c.outcome || '')
          );
        }

        const story = el('div', { class: 'story' },
          c.problem ? el('div', {}, el('h4', {}, 'The challenge'), el('p', {}, c.problem)) : null,
          c.approach ? el('div', {}, el('h4', {}, 'What I did'), el('p', {}, c.approach)) : null,
          c.outcome ? el('div', {}, el('h4', {}, 'Outcome'), el('p', {}, c.outcome)) : null
        );

        const aside = el('div', { class: 'aside' },
          roles.length ? el('div', {}, el('h4', {}, 'My role'), el('ul', {}, roles.map(r => el('li', {}, r)))) : null,
          c.context ? el('div', {}, el('h4', {}, 'Context'), el('p', {}, c.context)) : null
        );

        const details = el('details', { class: 'case' },
          el('summary', {},
            el('div', {},
              el('div', { class: 'case-meta' },
                c.company ? el('span', { class: 'company' }, c.company) : null,
                c.period ? el('span', {}, c.period) : null,
                ongoing ? el('span', { class: 'ongoing' }, 'Ongoing') : null
              ),
              el('h3', { class: 'case-title' }, c.title),
              el('p', { class: 'case-summary' }, c.summary),
              c.context ? el('p', { class: 'case-context' }, c.context) : null,
              el('div', { class: 'case-tags' }, list(c.tags).map(t => el('span', { class: 'pill' }, t))),
              more
            ),
            statBlock
          ),
          el('div', { class: 'case-body' }, story, aside)
        );

        details.dataset.categories = list(c.categories).map(s => s.toLowerCase()).join('|');
        // Search runs over the case study's own content, not section labels like "What I did"
        details.dataset.search = [
          c.title, c.summary, c.company, c.period, c.context, c.impact,
          c.problem, c.approach, c.outcome, roles, list(c.tags), list(c.categories)
        ].flat().filter(Boolean).join(' ').toLowerCase();
        return details;
      }

      function renderResults(cases){
        const results = cases.filter(c => statOf(c.impact)).slice(0, 3);
        const target = document.getElementById('results');
        if(!results.length){ target.remove(); return; }
        target.append(...results.map(c => el('div', { class: 'result' },
          el('div', { class: 'result-num' }, statOf(c.impact)),
          el('div', { class: 'result-text' }, el('strong', {}, c.title), c.impact)
        )));
      }

      function renderCases(data){
        const cases = list(data.cases);
        const feed = document.getElementById('feed');
        const filters = document.getElementById('filters');
        const q = document.getElementById('q');
        const count = document.getElementById('count');

        renderResults(cases);

        const nodes = cases.map(renderCase);
        const empty = el('div', { class: 'empty', hidden: 'hidden' }, 'No case studies match. Try another word or filter.');
        feed.append(...nodes, empty);

        // Filter chips are built from every category used in the case studies
        const categories = [];
        cases.forEach(c => list(c.categories).forEach(cat => {
          if(!categories.some(x => x.toLowerCase() === cat.toLowerCase())) categories.push(cat);
        }));

        let activeFilter = 'all';
        const chips = [el('button', { type: 'button', class: 'chip active', 'data-filter': 'all', 'aria-pressed': 'true' }, 'All')]
          .concat(categories.map(cat => el('button', { type: 'button', class: 'chip', 'data-filter': cat.toLowerCase(), 'aria-pressed': 'false' }, cat)));
        filters.append(...chips);

        function apply(){
          // Every typed word must match the start of a word, so "app" finds "App" but not "mapping"
          const terms = q.value.toLowerCase().split(/\s+/).filter(Boolean);
          let shown = 0;
          nodes.forEach(node => {
            const words = node.dataset.search.split(/[^\p{L}\p{N}]+/u);
            const okFilter = activeFilter === 'all' || node.dataset.categories.split('|').includes(activeFilter);
            const okQuery = terms.every(t => words.some(w => w.startsWith(t)));
            const ok = okFilter && okQuery;
            node.hidden = !ok;
            if(ok) shown += 1;
          });
          count.textContent = String(shown);
          empty.hidden = shown > 0;
        }

        chips.forEach(chip => {
          chip.addEventListener('click', () => {
            chips.forEach(c => { c.classList.remove('active'); c.setAttribute('aria-pressed', 'false'); });
            chip.classList.add('active');
            chip.setAttribute('aria-pressed', 'true');
            activeFilter = chip.getAttribute('data-filter');
            apply();
          });
        });

        q.addEventListener('input', apply);
        apply();
      }

      function renderSkills(s){
        document.getElementById('capability-list').append(
          ...list(s.capabilities).map((c, i) => el('div', { class: 'cap' },
            el('div', { class: 'cap-num' }, String(i + 1).padStart(2, '0')),
            el('div', {}, el('h3', {}, c.title), el('p', {}, c.text))
          ))
        );
        document.getElementById('tool-list').append(
          ...list(s.tools).map(t => el('span', { class: 'pill' }, t))
        );
      }

      function showError(target, err){
        console.error(err);
        document.getElementById(target).append(el('div', { class: 'load-error' }, 'This section could not be loaded. Please refresh the page.'));
      }

      load('content/profile.json').then(renderProfile).catch(err => showError('hero-facts', err));
      load('content/case-studies.json').then(renderCases).catch(err => showError('feed', err));
      load('content/skills.json').then(renderSkills).catch(err => showError('capability-list', err));
    })();
  </script>
</body>
</html>
