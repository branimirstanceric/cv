<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Branimir Stančerić | Delivery Manager | Case Studies</title>
  <meta name="description" content="Case studies by Branimir Stančerić, Delivery Manager and IT Project Manager focused on eCommerce, integrations, and predictable delivery." />
  <meta property="og:title" content="Branimir Stančerić | Delivery Manager" />
  <meta property="og:description" content="Case studies in eCommerce delivery, integrations, and platform migrations." />
  <meta property="og:image" content="https://branimirstanceric.github.io/cv/assets/profile.jpg" />

  <!-- Apply the saved or system theme before first paint -->
  <script>
    (function(){
      var t = null;
      try { t = localStorage.getItem('theme'); } catch(e) {}
      if(t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- Bump ?v= whenever style.css or common.js changes, so browsers don't mix old and new files -->
  <link rel="stylesheet" href="style.css?v=3" />
</head>

<body>
  <!--
    All text on this page lives in the content/ folder:
      content/profile.json       name, intro, contact details
      content/case-studies.json  case studies (each one also gets its own page, case.html?id=...)
      content/skills.json        capabilities and tooling
    Edit it through Pages CMS (app.pagescms.org) or directly in those files.
  -->
  <header class="container topbar-inner">
    <a class="brand" href="#top" data-field="name">Branimir Stančerić</a>
    <div class="topbar-right">
      <nav class="nav" aria-label="Primary navigation">
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch light or dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="top">
    <!-- Intro -->
    <section class="container intro">
      <div class="person">
        <div class="avatar" id="avatar"></div>
        <div>
          <div class="person-name" data-field="name"></div>
          <div class="person-role" data-field="headline"></div>
          <div class="status" id="status" hidden></div>
        </div>
      </div>
      <h1 class="intro-title" id="intro-title"></h1>
      <p class="intro-text" data-field="hero_intro"></p>
      <div class="links" id="intro-links"></div>
    </section>

    <!-- Work -->
    <section class="section" id="work">
      <div class="container">
        <h2 class="label">Selected work</h2>
        <ol class="work" id="work-list"></ol>
      </div>
    </section>

    <!-- About -->
    <section class="section" id="about">
      <div class="container">
        <h2 class="label">How I work</h2>
        <div class="caps" id="capability-list"></div>
        <p class="tools" id="tools" hidden></p>
      </div>
    </section>

    <!-- Contact -->
    <section class="section" id="contact">
      <div class="container">
        <h2 class="label">Contact</h2>
        <p class="contact-title" style="margin-top:20px;">Let's talk about your next delivery.</p>
        <p class="contact-text" data-field="contact_intro"></p>
        <div><a class="email" id="email"></a></div>
        <div class="links" id="contact-links"></div>
      </div>
    </section>
  </main>

  <footer class="container">© <span id="year"></span> <span data-field="name"></span></footer>

  <script src="common.js?v=3"></script>
  <script>
    (function(){
      const { el, asset, list, statOf, caseUrl, isOngoing, yearsOf, load, fillFields, textLink, contactLinks, showError } = window.Site;

      function renderProfile(p){
        fillFields(p);

        if(p.photo){
          const avatar = document.getElementById('avatar');
          const img = el('img', { src: asset(p.photo), alt: '' });
          img.addEventListener('error', () => img.remove());
          avatar.append(img);
        }

        if(p.status_line){
          const status = document.getElementById('status');
          status.textContent = p.status_line;
          status.hidden = false;
        }

        // Intro title with the highlighted phrase in italics
        const title = document.getElementById('intro-title');
        const text = p.hero_title || '';
        const hl = p.hero_highlight || '';
        const at = hl ? text.indexOf(hl) : -1;
        if(at >= 0){
          title.append(text.slice(0, at), el('span', { class: 'accent' }, hl), text.slice(at + hl.length));
        } else {
          title.textContent = text;
        }

        const introLinks = [textLink('Selected work', '#work')];
        if(p.cv_file) introLinks.push(textLink('Download CV', asset(p.cv_file), true));
        document.getElementById('intro-links').append(...introLinks);

        const email = document.getElementById('email');
        if(p.email){
          email.textContent = p.email;
          email.href = 'mailto:' + p.email;
        } else {
          email.remove();
        }
        document.getElementById('contact-links').append(...contactLinks(p));
      }

      function renderWork(data){
        const cases = list(data.cases);
        document.getElementById('work-list').append(...cases.map(c => {
          const stat = statOf(c.impact);
          return el('li', { class: 'work-item' },
            el('div', { class: 'work-years' }, isOngoing(c) ? el('span', { class: 'ongoing' }, yearsOf(c)) : yearsOf(c)),
            el('div', {},
              el('h3', { class: 'work-title' }, el('a', { class: 'work-link', href: caseUrl(c) }, c.title)),
              c.summary ? el('p', { class: 'work-summary' }, c.summary) : null,
              c.company ? el('p', { class: 'work-company' }, c.company) : null
            ),
            el('div', { class: 'work-stat', title: c.impact || '' }, stat)
          );
        }));
      }

      function renderSkills(s){
        document.getElementById('capability-list').append(
          ...list(s.capabilities).map(c => el('div', { class: 'cap' }, el('h3', {}, c.title), el('p', {}, c.text)))
        );
        const tools = list(s.tools);
        if(tools.length){
          const node = document.getElementById('tools');
          node.append(el('strong', {}, 'Tools and methods: '), tools.join(', ') + '.');
          node.hidden = false;
        }
      }

      load('content/profile.json').then(renderProfile).catch(err => showError('intro-links', err));
      load('content/case-studies.json').then(renderWork).catch(err => showError('work-list', err));
      load('content/skills.json').then(renderSkills).catch(err => showError('capability-list', err));
    })();
  </script>
</body>
</html>
