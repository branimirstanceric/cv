<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Branimir Stančerić | Delivery Manager | Case Studies</title>
  <meta name="description" content="Minimalist case study portfolio for Branimir Stančerić. Delivery Manager and IT Project Manager focused on eCommerce, integrations, and predictable delivery." />

  <style>
    :root{
      --bg: #f7f8fb;
      --paper: #ffffff;
      --ink: #0b1220;
      --muted: #52637a;
      --hair: #e4e9f1;

      --accent: #2563eb;
      --accent2:#0ea5e9;
      --soft: rgba(37,99,235,0.10);

      --shadow: 0 18px 45px rgba(2, 6, 23, 0.08);
      --r-xl: 22px;
      --r-lg: 16px;
      --r-md: 12px;
      --r-pill: 999px;

      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      --t: 180ms ease-out;
    }

    [data-theme="dark"]{
      --bg: #08101f;
      --paper: #0c1630;
      --ink: #e7edf7;
      --muted: #a8b7cf;
      --hair: #1f2d4d;

      --accent: #38bdf8;
      --accent2:#a78bfa;
      --soft: rgba(56,189,248,0.12);

      --shadow: 0 18px 45px rgba(0,0,0,0.45);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html{ scroll-behavior:smooth; }
    body{
      font-family: var(--font);
      color: var(--ink);
      line-height: 1.65;
      background:
        radial-gradient(circle at top, var(--paper) 0, var(--bg) 55%, rgba(14,165,233,0.10) 100%);
      -webkit-font-smoothing: antialiased;
    }
    a{ color: inherit; text-decoration: none; }
    strong{ font-weight: 850; }
    .muted{ color: var(--muted); }
    .nowrap{ white-space: nowrap; }

    /* Top bar */
    .topbar{
      position: sticky;
      top: 0;
      z-index: 50;
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      border-bottom: 1px solid var(--hair);
      backdrop-filter: blur(12px);
    }
    .topbar-inner{
      max-width: 1160px;
      margin: 0 auto;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 260px;
    }
    .logo{
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid var(--hair);
      background: radial-gradient(circle at 30% 20%, #7dd3fc 0, #38bdf8 35%, #60a5fa 70%, #6366f1 100%);
    }
    .brand-title{
      font-weight: 900;
      letter-spacing: -0.02em;
      font-size: 0.98rem;
    }
    .brand-sub{
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.2;
    }

    .nav{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      font-size: 0.92rem;
      color: var(--muted);
    }
    .nav a{
      padding: 6px 10px;
      border-radius: var(--r-pill);
      border: 1px solid transparent;
      transition: background-color var(--t), border-color var(--t), transform 120ms ease-out, color var(--t);
    }
    .nav a:hover{
      background: var(--paper);
      border-color: var(--hair);
      color: var(--ink);
      transform: translateY(-1px);
    }
    @media (max-width: 940px){ .nav{ display:none; } }

    .right-tools{
      display:flex;
      align-items:center;
      gap: 10px;
    }
    .toggle{
      display:inline-flex;
      border:1px solid var(--hair);
      border-radius: var(--r-pill);
      overflow:hidden;
      background: var(--paper);
      box-shadow: 0 10px 20px rgba(2,6,23,0.06);
    }
    .toggle button{
      border:0;
      background:transparent;
      cursor:pointer;
      padding: 7px 10px;
      font-size: 0.84rem;
      color: var(--muted);
      transition: background-color var(--t), color var(--t);
    }
    .toggle button.active{
      background: color-mix(in srgb, var(--paper) 70%, var(--soft) 30%);
      color: var(--ink);
      font-weight: 900;
    }

    /* Layout */
    .wrap{
      max-width: 1160px;
      margin: 0 auto;
      padding: 18px 18px 74px;
    }
    .grid{
      margin-top: 18px;
      display:grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 980px){
      .grid{ grid-template-columns: minmax(0,1fr); }
    }

    .card{
      background: var(--paper);
      border: 1px solid var(--hair);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:-2px;
      background: radial-gradient(circle at top left, var(--soft), transparent 58%);
      pointer-events:none;
    }
    .pad{ padding: 18px; }

    /* Left rail */
    .rail{
      position: sticky;
      top: 74px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (max-width: 980px){
      .rail{ position: static; }
    }

    .profile{
      display:flex;
      flex-direction: column;
      gap: 12px;
    }
    .profile-top{
      display:flex;
      gap: 12px;
      align-items: center;
    }
    .avatar{
      width: 86px;
      height: 86px;
      border-radius: 18px;
      border: 1px solid var(--hair);
      background: linear-gradient(135deg, var(--soft), rgba(99,102,241,0.10));
      overflow:hidden;
      flex: 0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .avatar img{
      width:100%;
      height:100%;
      object-fit: cover;
    }
    .avatar-fallback{
      padding: 10px;
      text-align:center;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .name{
      font-size: 1.18rem;
      font-weight: 950;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .role{
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
    }
    .badge-row{
      display:flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .badge{
      font-size: 0.82rem;
      padding: 6px 10px;
      border-radius: var(--r-pill);
      border: 1px solid var(--hair);
      background: color-mix(in srgb, var(--paper) 70%, var(--soft) 30%);
      color: var(--muted);
    }

    .rail-actions{
      display:flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
      border-radius: var(--r-pill);
      padding: 10px 12px;
      border: 1px solid transparent;
      background: transparent;
      font-size: 0.92rem;
      cursor: pointer;
      transition: transform 120ms ease-out, background-color var(--t), border-color var(--t);
    }
    .btn.primary{
      background: linear-gradient(to right, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent2)));
      color: #fff;
      font-weight: 900;
      box-shadow: 0 14px 26px color-mix(in srgb, var(--accent) 26%, transparent);
    }
    .btn.ghost{
      background: var(--paper);
      border-color: var(--hair);
      color: var(--ink);
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn.ghost:hover{ background: color-mix(in srgb, var(--paper) 70%, var(--soft) 30%); }

    .kv{
      display:grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .kv-row{
      display:flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--r-lg);
      border: 1px solid var(--hair);
      background: var(--paper);
      color: var(--muted);
      font-size: 0.9rem;
    }
    .kv-row strong{ color: var(--ink); }

    /* Right content */
    .hero{
      padding: 18px;
    }
    .kicker{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      border: 1px solid var(--hair);
      background: color-mix(in srgb, var(--paper) 70%, var(--soft) 30%);
      padding: 6px 10px;
      border-radius: var(--r-pill);
      width: fit-content;
      margin-bottom: 12px;
    }
    .dot{
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34,197,94,0.18);
    }

    .title{
      font-size: 2.05rem;
      line-height: 1.12;
      letter-spacing: -0.04em;
      margin-bottom: 10px;
      max-width: 50ch;
    }
    @media (min-width: 1020px){
      .title{ font-size: 2.45rem; }
    }
    .accent{
      background: linear-gradient(to right, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      color: transparent;
    }
    .lead{
      color: var(--muted);
      font-size: 1.02rem;
      max-width: 78ch;
      margin-bottom: 12px;
    }

    .inline-meta{
      display:flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .inline-meta a{
      border-bottom: 1px solid transparent;
      transition: border-color var(--t), color var(--t);
    }
    .inline-meta a:hover{
      border-color: var(--hair);
      color: var(--ink);
    }

    /* Controls */
    .controls{
      display:flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-top: 1px solid var(--hair);
      background: color-mix(in srgb, var(--paper) 88%, transparent);
    }
    .search{
      flex: 1 1 240px;
      display:flex;
      align-items:center;
      gap: 10px;
      border: 1px solid var(--hair);
      background: var(--paper);
      border-radius: var(--r-pill);
      padding: 10px 12px;
      color: var(--muted);
    }
    .search input{
      border:0;
      outline:0;
      width:100%;
      background: transparent;
      color: var(--ink);
      font-size: 0.94rem;
    }
    .filters{
      display:flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
    }
    .chip{
      border: 1px solid var(--hair);
      background: var(--paper);
      color: var(--muted);
      border-radius: var(--r-pill);
      padding: 8px 10px;
      font-size: 0.86rem;
      cursor:pointer;
      transition: background-color var(--t), transform 120ms ease-out, border-color var(--t), color var(--t);
      user-select:none;
    }
    .chip:hover{ transform: translateY(-1px); }
    .chip.active{
      background: color-mix(in srgb, var(--paper) 65%, var(--soft) 35%);
      color: var(--ink);
      border-color: color-mix(in srgb, var(--hair) 55%, var(--accent) 45%);
      font-weight: 900;
    }

    /* Case studies feed */
    .section{
      margin-top: 16px;
    }
    .section-head{
      padding: 0 2px 10px 2px;
      display:flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .section-head h2{
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
    }
    .count{
      color: var(--muted);
      font-size: 0.92rem;
    }

    .feed{
      display:flex;
      flex-direction: column;
      gap: 12px;
    }

    details.case{
      border-top: 1px solid transparent;
    }
    details.case > summary{
      list-style: none;
      cursor: pointer;
      padding: 16px 18px;
      display:flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      transition: background-color var(--t);
    }
    details.case > summary::-webkit-details-marker{ display:none; }
    details.case > summary:hover{
      background: color-mix(in srgb, var(--paper) 70%, var(--soft) 30%);
    }

    .case-left{
      min-width: 0;
      flex: 1 1 auto;
    }
    .case-title{
      font-size: 1.15rem;
      font-weight: 950;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .case-sub{
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.4;
    }
    .case-tags{
      display:flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .tag{
      font-size: 0.82rem;
      padding: 6px 10px;
      border-radius: var(--r-pill);
      border: 1px solid var(--hair);
      background: var(--paper);
      color: var(--muted);
    }

    .case-right{
      flex: 0 0 auto;
      display:flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      text-align:right;
      color: var(--muted);
      font-size: 0.88rem;
      white-space: nowrap;
    }
    .chev{
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid var(--hair);
      background: var(--paper);
      display:flex;
      align-items:center;
      justify-content:center;
      transition: transform 120ms ease-out, background-color var(--t);
      color: var(--muted);
    }
    details.case[open] .chev{
      transform: rotate(180deg);
      background: color-mix(in srgb, var(--paper) 70%, var(--soft) 30%);
      color: var(--ink);
    }

    .case-body{
      padding: 0 18px 18px 18px;
    }
    .case-grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 8px;
    }
    @media (max-width: 860px){
      .case-grid{ grid-template-columns: minmax(0,1fr); }
      .case-right{ display:none; }
    }

    .box{
      border: 1px solid var(--hair);
      background: var(--paper);
      border-radius: var(--r-lg);
      padding: 12px;
    }
    .label{
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      font-weight: 900;
      margin-bottom: 6px;
    }
    .box p, .box ul{
      color: var(--muted);
      font-size: 0.95rem;
    }

    .impact{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: var(--r-lg);
      border: 1px solid var(--hair);
      background: color-mix(in srgb, var(--paper) 65%, var(--soft) 35%);
      font-weight: 900;
    }

    /* Skills / tools blocks */
    .two{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 860px){ .two{ grid-template-columns: minmax(0,1fr); } }

    .mini h3{
      font-size: 1.02rem;
      font-weight: 950;
      margin-bottom: 6px;
    }
    .mini p{ color: var(--muted); }

    .tooltags{
      display:flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    /* Footer */
    footer{
      text-align:center;
      color: var(--muted);
      font-size: 0.88rem;
      padding: 26px 18px 36px;
    }
    footer span{ color: var(--ink); font-weight: 900; }
    /* Content loaded from content/*.json */
    .case-context{
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.86rem;
    }
    .load-error{
      padding: 14px 18px;
      border: 1px solid var(--hair);
      border-radius: var(--r-lg);
      color: var(--muted);
    }
  </style>
</head>

<body>
  <!--
    All text on this page lives in the content/ folder:
      content/profile.json       name, intro, contact details
      content/case-studies.json  case studies
      content/skills.json        capabilities and tooling
    Edit it through Pages CMS (app.pagescms.org) or directly in those files.
  -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <div class="brand-title" data-field="name"></div>
          <div class="brand-sub" data-field="headline"></div>
        </div>
      </div>

      <nav class="nav" aria-label="Primary navigation">
        <a href="#cases">Case studies</a>
        <a href="#capabilities">Capabilities</a>
        <a href="#tooling">Tooling</a>
        <a href="#contact">Contact</a>
      </nav>

      <div class="right-tools">
        <div class="toggle" aria-label="Theme toggle">
          <button class="active" id="btn-light" type="button">Light</button>
          <button id="btn-dark" type="button">Dark</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="grid">
      <!-- LEFT RAIL -->
      <aside class="rail" aria-label="Profile">
        <section class="card pad profile">
          <div class="profile-top">
            <div class="avatar" id="avatar" aria-label="Profile photo"></div>
            <div>
              <div class="name" data-field="name"></div>
              <div class="role" data-field="short_bio"></div>
              <div class="badge-row" id="badges" aria-label="Highlights"></div>
            </div>
          </div>

          <div class="rail-actions">
            <a class="btn primary" href="#cases"><span>View case studies</span><span>↘</span></a>
            <a class="btn ghost" id="cv-link" href="assets/cv.pdf" target="_blank" rel="noreferrer"><span>Download CV</span><span>⬇</span></a>
            <a class="btn ghost" href="#contact"><span>Contact</span><span>✉</span></a>
          </div>

          <div class="kv" id="quick-facts" aria-label="Quick info"></div>
        </section>

        <section class="card pad" id="contact">
          <div style="font-weight:950;font-size:1.02rem;margin-bottom:8px;">Contact</div>
          <div class="muted" style="font-size:0.95rem;margin-bottom:10px;" data-field="contact_intro"></div>
          <div class="kv" id="contact-list"></div>
        </section>
      </aside>

      <!-- RIGHT CONTENT -->
      <section class="card" aria-label="Main content">
        <div class="hero pad">
          <div class="kicker"><span class="dot"></span><span data-field="status_line"></span></div>
          <div class="title" id="hero-title"></div>
          <div class="lead" data-field="hero_intro"></div>
          <div class="inline-meta" id="hero-facts"></div>
        </div>

        <!-- Controls -->
        <div class="controls" aria-label="Case study controls">
          <div class="search" aria-label="Search">
            <span class="muted">Search</span>
            <input id="q" type="text" placeholder="Try: integration, logistics, migration, app" />
          </div>
          <div class="filters" id="filters" aria-label="Filters"></div>
        </div>

        <!-- Case studies -->
        <div class="pad section" id="cases">
          <div class="section-head">
            <h2>Case studies</h2>
            <div class="count"><span id="count">0</span> shown</div>
          </div>
          <div class="feed" id="feed"></div>
        </div>

        <!-- Capabilities -->
        <div class="pad section" id="capabilities">
          <div class="section-head">
            <h2>Capabilities</h2>
            <div class="count muted">How I operate in delivery</div>
          </div>
          <div class="two" id="capability-list"></div>
        </div>

        <!-- Tooling -->
        <div class="pad section" id="tooling">
          <div class="section-head">
            <h2>Tooling</h2>
            <div class="count muted">What I use day to day</div>
          </div>
          <div class="card pad">
            <div class="tooltags" id="tool-list"></div>
          </div>
        </div>

      </section>
    </div>
  </main>

  <footer>
    © <span data-field="name"></span> · Case study portfolio on GitHub Pages
  </footer>

  <script>
    (function(){
      // Theme toggle
      const btnLight = document.getElementById('btn-light');
      const btnDark  = document.getElementById('btn-dark');

      function setTheme(theme){
        document.documentElement.setAttribute('data-theme', theme);
        btnLight.classList.toggle('active', theme === 'light');
        btnDark.classList.toggle('active', theme === 'dark');
        try { localStorage.setItem('theme', theme); } catch(e) {}
      }

      btnLight.addEventListener('click', () => setTheme('light'));
      btnDark.addEventListener('click',  () => setTheme('dark'));

      const saved = (() => { try { return localStorage.getItem('theme'); } catch(e){ return null; } })();
      setTheme(saved || 'light');

      // Small DOM helper: el('div', {class:'x'}, 'text', childNode, ...)
      function el(tag, attrs, ...children){
        const node = document.createElement(tag);
        Object.entries(attrs || {}).forEach(([k, v]) => {
          if(v !== undefined && v !== null && v !== '') node.setAttribute(k, v);
        });
        children.flat().forEach(c => {
          if(c === undefined || c === null || c === '') return;
          node.append(c instanceof Node ? c : String(c));
        });
        return node;
      }

      // Pages CMS may store media paths with a leading slash; the site lives under /cv/, so keep them relative.
      function asset(path){
        return (path || '').replace(/^\/+/, '');
      }

      function list(value){
        return Array.isArray(value) ? value.filter(Boolean) : [];
      }

      async function load(path){
        const res = await fetch(path, { cache: 'no-cache' });
        if(!res.ok) throw new Error(path + ': ' + res.status);
        return res.json();
      }

      function renderProfile(p){
        document.querySelectorAll('[data-field]').forEach(node => {
          const value = p[node.getAttribute('data-field')];
          if(typeof value === 'string') node.textContent = value;
        });

        const avatar = document.getElementById('avatar');
        if(p.photo){
          const img = el('img', { src: asset(p.photo), alt: p.name });
          img.addEventListener('error', () => {
            avatar.replaceChildren(el('div', { class: 'avatar-fallback' }, 'Photo not found'));
          });
          avatar.append(img);
        }

        if(p.cv_file) document.getElementById('cv-link').setAttribute('href', asset(p.cv_file));

        document.getElementById('badges').append(
          ...list(p.badges).map(b => el('span', { class: 'badge' }, b))
        );

        document.getElementById('quick-facts').append(
          ...list(p.quick_facts).map(f => el('div', { class: 'kv-row' }, el('strong', {}, f.label), el('span', {}, f.value)))
        );

        // Hero title with the highlighted phrase in accent colour
        const title = document.getElementById('hero-title');
        const text = p.hero_title || '';
        const hl = p.hero_highlight || '';
        const at = hl ? text.indexOf(hl) : -1;
        if(at >= 0){
          title.append(text.slice(0, at), el('span', { class: 'accent' }, hl), text.slice(at + hl.length));
        } else {
          title.textContent = text;
        }

        document.getElementById('hero-facts').append(
          ...list(p.hero_facts).map(f => el('span', {}, el('strong', {}, f.label + ':'), ' ' + f.value))
        );

        const contacts = [];
        if(p.email) contacts.push(el('div', { class: 'kv-row' }, el('strong', {}, 'Email'), el('a', { class: 'nowrap', href: 'mailto:' + p.email }, p.email)));
        if(p.linkedin) contacts.push(el('div', { class: 'kv-row' }, el('strong', {}, 'LinkedIn'), el('a', { class: 'nowrap', href: p.linkedin, target: '_blank', rel: 'noreferrer' }, 'Open profile')));
        if(p.github) contacts.push(el('div', { class: 'kv-row' }, el('strong', {}, 'GitHub'), el('a', { class: 'nowrap', href: p.github, target: '_blank', rel: 'noreferrer' }, 'Open profile')));
        document.getElementById('contact-list').append(...contacts);
      }

      function renderCase(c){
        const box = (label, ...content) => el('div', { class: 'box' }, el('div', { class: 'label' }, label), ...content);
        const roles = list(c.my_role);

        const details = el('details', { class: 'case' },
          el('summary', {},
            el('div', { class: 'case-left' },
              el('div', { class: 'case-title' }, c.title),
              el('div', { class: 'case-sub' }, c.summary),
              c.context ? el('div', { class: 'case-context' }, c.context) : null,
              el('div', { class: 'case-tags' }, list(c.tags).map(t => el('span', { class: 'tag' }, t)))
            ),
            el('div', { class: 'case-right' },
              el('div', {}, c.company),
              el('div', {}, c.period),
              el('div', { class: 'chev' }, '⌄')
            )
          ),
          el('div', { class: 'case-body' },
            el('div', { class: 'case-grid' },
              c.problem ? box('Problem', el('p', {}, c.problem)) : null,
              c.approach ? box('Approach', el('p', {}, c.approach)) : null,
              roles.length ? box('My role', el('ul', {}, roles.map(r => el('li', {}, r)))) : null,
              c.outcome ? box('Outcome', el('p', {}, c.outcome)) : null
            ),
            c.impact ? el('div', { class: 'impact' }, 'Impact: ' + c.impact) : null
          )
        );
        details.dataset.categories = list(c.categories).map(s => s.toLowerCase()).join('|');
        // Search runs over the case study's own content, not section labels like "Approach"
        details.dataset.search = [
          c.title, c.summary, c.company, c.period, c.context, c.impact,
          c.problem, c.approach, c.outcome, roles, list(c.tags), list(c.categories)
        ].flat().filter(Boolean).join(' ').toLowerCase();
        return details;
      }

      function renderCases(data){
        const cases = list(data.cases);
        const feed = document.getElementById('feed');
        const filters = document.getElementById('filters');
        const q = document.getElementById('q');
        const count = document.getElementById('count');

        const nodes = cases.map(renderCase);
        feed.append(...nodes);

        // Filter chips are built from every category used in the case studies
        const categories = [];
        cases.forEach(c => list(c.categories).forEach(cat => {
          if(!categories.some(x => x.toLowerCase() === cat.toLowerCase())) categories.push(cat);
        }));

        let activeFilter = 'all';
        const chips = [el('span', { class: 'chip active', 'data-filter': 'all' }, 'All')]
          .concat(categories.map(cat => el('span', { class: 'chip', 'data-filter': cat.toLowerCase() }, cat)));
        filters.append(...chips);

        function apply(){
          // Every typed word must match the start of a word, so "app" finds "App" but not "mapping"
          const terms = q.value.toLowerCase().split(/\s+/).filter(Boolean);
          let shown = 0;
          nodes.forEach(node => {
            const words = node.dataset.search.split(/[^\p{L}\p{N}]+/u);
            const okFilter = activeFilter === 'all' || node.dataset.categories.split('|').includes(activeFilter);
            const okQuery = terms.every(t => words.some(w => w.startsWith(t)));
            const ok = okFilter && okQuery;
            node.style.display = ok ? '' : 'none';
            if(ok) shown += 1;
          });
          count.textContent = String(shown);
        }

        chips.forEach(chip => {
          chip.addEventListener('click', () => {
            chips.forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            activeFilter = chip.getAttribute('data-filter');
            apply();
          });
        });

        q.addEventListener('input', apply);
        apply();
      }

      function renderSkills(s){
        document.getElementById('capability-list').append(
          ...list(s.capabilities).map(c => el('div', { class: 'card pad mini' }, el('h3', {}, c.title), el('p', {}, c.text)))
        );
        document.getElementById('tool-list').append(
          ...list(s.tools).map(t => el('span', { class: 'tag' }, t))
        );
      }

      function showError(target, err){
        console.error(err);
        document.getElementById(target).append(el('div', { class: 'load-error' }, 'This section could not be loaded. Please refresh the page.'));
      }

      load('content/profile.json').then(renderProfile).catch(err => showError('hero-facts', err));
      load('content/case-studies.json').then(renderCases).catch(err => showError('feed', err));
      load('content/skills.json').then(renderSkills).catch(err => showError('capability-list', err));
    })();
  </script>
</body>
</html>
