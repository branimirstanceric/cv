<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Branimir Stančerić</title>
  <meta name="description" content="Branimir Stančerić, Delivery Manager and IT Project Manager focused on eCommerce, integrations, and predictable delivery." />
  <meta property="og:title" content="Branimir Stančerić | Delivery Manager" />
  <meta property="og:description" content="Projects in eCommerce delivery, integrations, and platform migrations." />
  <meta property="og:image" content="https://branimirstanceric.github.io/cv/assets/profile.jpg" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Apply the saved or system theme before first paint -->
  <script>
    (function(){
      var t = null;
      try { t = localStorage.getItem('theme'); } catch(e) {}
      if(t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Bump ?v= whenever style.css or common.js changes, so browsers don't mix old and new files -->
  <link rel="stylesheet" href="style.css?v=20" />
</head>

<body>
  <!--
    All text on this page lives in the content/ folder:
      content/profile.json       name, intro, contact details
      content/skills.json        capabilities
    All projects are on work.html; each project has its own page, case.html?id=...
    Edit it through Pages CMS (app.pagescms.org) or directly in those files.
  -->
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="#top" data-field="name">Branimir Stančerić</a>
      <nav class="nav" id="site-nav" aria-label="Primary navigation">
        <a href="index.html" aria-current="page">About</a>
        <a href="work.html">Work</a>
        <a href="#contact">Contact</a>
      </nav>
      <div class="topbar-actions">
        <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch light or dark theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
          <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="top">
    <!-- Hero: full-width photo that scrolls at half speed behind the intro (parallax) -->
    <section class="hero hero-photo" id="hero">
      <div class="hero-bg" id="hero-bg" aria-hidden="true">
        <!-- No src here: the photo chosen in Pages CMS is set by the script and fades in once loaded -->
        <img id="hero-bg-img" alt="" />
      </div>
      <div class="container hero-content">
        <div class="kicker"><span class="dot"></span><span data-field="status_line"></span></div>
        <h1 class="hero-title" id="hero-title"></h1>
        <p class="hero-intro" data-field="hero_intro"></p>
        <!-- Hobbies: a small line under the intro, shown only when filled in -->
        <p class="hero-note" id="hobbies" hidden></p>
        <div class="hero-actions">
          <a class="btn primary" href="work.html">View my work</a>
          <a class="btn" id="cv-link" href="assets/cv.pdf" target="_blank" rel="noreferrer">Download CV</a>
        </div>
        <div class="hero-facts" id="hero-facts"></div>
      </div>
    </section>

    <!-- Pointer to the Work page (all projects live on work.html) -->
    <section class="section" id="work-link">
      <div class="container">
        <p class="teaser">Curious what I've delivered? See all my projects on the <a href="work.html">Work page&nbsp;→</a></p>
      </div>
    </section>

    <!-- Capabilities -->
    <section class="section" id="capabilities">
      <div class="container">
        <div class="section-head">
          <div>
            <div class="eyebrow">How I work</div>
            <h2 class="section-title">Capabilities</h2>
          </div>
        </div>
        <div class="caps" id="capability-list"></div>
      </div>
    </section>

    <!-- Contact -->
    <div class="container">
      <section class="contact" id="contact">
        <div>
          <div class="eyebrow">Contact</div>
          <h2 class="section-title">Let's talk about your next delivery.</h2>
          <p data-field="contact_intro"></p>
        </div>
        <div class="contact-links" id="contact-list"></div>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">Copyright © <span id="year"></span> <span data-field="name"></span>. All rights reserved.</div>
  </footer>

  <script src="common.js?v=20"></script>
  <script>
    (function(){
      const { el, asset, list, load, fillFields, contactButtons, showError } = window.Site;

      // Background photo behind the intro (Pages CMS: "Intro background photo").
      // Only the chosen photo is requested, and it fades in when ready, so no other picture flashes first.
      function showHeroPhoto(src){
        const img = document.getElementById('hero-bg-img');
        img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
        img.src = src;
      }

      function renderProfile(p){
        fillFields(p);

        showHeroPhoto(asset(p.hero_background) || 'assets/hero.jpg');

        if(p.cv_file) document.getElementById('cv-link').setAttribute('href', asset(p.cv_file));

        // Hero title with the highlighted phrase in accent colour
        const title = document.getElementById('hero-title');
        const text = p.hero_title || '';
        const hl = p.hero_highlight || '';
        const at = hl ? text.indexOf(hl) : -1;
        if(at >= 0){
          title.append(text.slice(0, at), el('span', { class: 'accent' }, hl), text.slice(at + hl.length));
        } else {
          title.textContent = text;
        }

        document.getElementById('hero-facts').append(
          ...list(p.hero_facts).map(f => el('span', {}, el('strong', {}, f.label), ' ' + f.value))
        );

        const hobbies = (p.hobbies || '').trim();
        if(hobbies){
          const note = document.getElementById('hobbies');
          note.textContent = hobbies;
          note.hidden = false;
        }

        document.getElementById('contact-list').append(...contactButtons(p));
      }

      function renderSkills(s){
        document.getElementById('capability-list').append(
          ...list(s.capabilities).map((c, i) => el('div', { class: 'cap' },
            el('div', { class: 'cap-num' }, String(i + 1).padStart(2, '0')),
            el('div', {}, el('h3', {}, c.title), el('p', {}, c.text))
          ))
        );
      }

      load('content/profile.json').then(renderProfile).catch(err => {
        showHeroPhoto('assets/hero.jpg');
        showError('hero-facts', err);
      });
      load('content/skills.json').then(renderSkills).catch(err => showError('capability-list', err));

      // Parallax: the intro photo moves at half the scroll speed, so it seems to sit behind the text.
      // Skipped for visitors who ask their system for reduced motion.
      const hero = document.getElementById('hero');
      const heroBg = document.getElementById('hero-bg');
      if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
        let ticking = false;
        const update = () => {
          ticking = false;
          const y = window.scrollY;
          if(y > hero.offsetTop + hero.offsetHeight) return; // off screen, nothing to move
          heroBg.style.transform = 'translate3d(0, ' + (y * 0.5).toFixed(1) + 'px, 0)';
        };
        window.addEventListener('scroll', () => {
          if(!ticking){ ticking = true; requestAnimationFrame(update); }
        }, { passive: true });
        update();
      }
    })();
  </script>

  <!-- Visitor statistics (GoatCounter, cookie-free): https://branimir.goatcounter.com -->
  <script data-goatcounter="https://branimir.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
