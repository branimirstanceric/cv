<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Branimir Stančerić</title>
  <meta name="description" content="Case studies by Branimir Stančerić, Delivery Manager and IT Project Manager focused on eCommerce, integrations, and predictable delivery." />
  <meta property="og:title" content="Branimir Stančerić | Delivery Manager" />
  <meta property="og:description" content="Case studies in eCommerce delivery, integrations, and platform migrations." />
  <meta property="og:image" content="https://branimirstanceric.github.io/cv/assets/profile.jpg" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Apply the saved or system theme before first paint -->
  <script>
    (function(){
      var t = null;
      try { t = localStorage.getItem('theme'); } catch(e) {}
      if(t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Bump ?v= whenever style.css or common.js changes, so browsers don't mix old and new files -->
  <link rel="stylesheet" href="style.css?v=13" />
</head>

<body>
  <!--
    All text on this page lives in the content/ folder:
      content/profile.json       name, intro, contact details
      content/case-studies.json  case studies (each one also gets its own page, case.html?id=...)
      content/experience.json    jobs for the Experience timeline
      content/skills.json        capabilities
    Edit it through Pages CMS (app.pagescms.org) or directly in those files.
  -->
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="#top" data-field="name">Branimir Stančerić</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="#cases">Work</a>
        <a href="#experience">Experience</a>
        <a href="#capabilities">Capabilities</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch light or dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="top">
    <!-- Hero -->
    <section class="hero">
      <div class="container hero-grid">
        <div>
          <div class="kicker"><span class="dot"></span><span data-field="status_line"></span></div>
          <h1 class="hero-title" id="hero-title"></h1>
          <p class="hero-intro" data-field="hero_intro"></p>
          <!-- Hobbies: a small line under the intro, shown only when filled in -->
          <p class="hero-note" id="hobbies" hidden></p>
          <div class="hero-actions">
            <a class="btn primary" href="#cases">View my work</a>
            <a class="btn" id="cv-link" href="assets/cv.pdf" target="_blank" rel="noreferrer">Download CV</a>
          </div>
          <div class="hero-facts" id="hero-facts"></div>
        </div>

        <aside class="profile-card" aria-label="Profile">
          <div class="avatar" id="avatar"></div>
          <div class="badges" id="badges"></div>
          <dl class="facts" id="quick-facts"></dl>
        </aside>
      </div>
    </section>

    <!-- Case studies -->
    <section class="section" id="cases">
      <div class="container">
        <div class="section-head">
          <div>
            <div class="eyebrow">Selected work</div>
            <h2 class="section-title">Case studies</h2>
          </div>
        </div>

        <!-- Case studies with "Show on the homepage" switched on -->
        <div class="feed" id="feed"></div>
        <a class="all-work-link" href="#experience">All projects by role ↓</a>
      </div>
    </section>

    <!-- Experience: one row per job, with that job's case studies linked under it -->
    <section class="section" id="experience">
      <div class="container">
        <div class="section-head">
          <div>
            <div class="eyebrow">Career</div>
            <h2 class="section-title">Experience</h2>
          </div>
        </div>
        <ol class="jobs" id="job-list"></ol>
      </div>
    </section>

    <!-- Capabilities -->
    <section class="section" id="capabilities">
      <div class="container">
        <div class="section-head">
          <div>
            <div class="eyebrow">How I work</div>
            <h2 class="section-title">Capabilities</h2>
          </div>
        </div>
        <div class="caps" id="capability-list"></div>
      </div>
    </section>

    <!-- Contact -->
    <div class="container">
      <section class="contact" id="contact">
        <div>
          <div class="eyebrow">Contact</div>
          <h2 class="section-title">Let's talk about your next delivery.</h2>
          <p data-field="contact_intro"></p>
        </div>
        <div class="contact-links" id="contact-list"></div>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">Copyright © <span id="year"></span> <span data-field="name"></span>. All rights reserved.</div>
  </footer>

  <script src="common.js?v=13"></script>
  <script>
    (function(){
      const { el, icon, ICONS, asset, list, statFor, withJobLogos, caseUrl, caseMeta, logoTile, load, fillFields, contactButtons, showError } = window.Site;

      function renderProfile(p){
        fillFields(p);

        const avatar = document.getElementById('avatar');
        if(p.photo){
          const img = el('img', { src: asset(p.photo), alt: p.name });
          img.addEventListener('error', () => avatar.replaceChildren('Photo not found'));
          avatar.append(img);
        }

        if(p.cv_file) document.getElementById('cv-link').setAttribute('href', asset(p.cv_file));

        // Badges and quick facts are optional; drop their (bordered) containers when empty
        const badges = document.getElementById('badges');
        const badgeList = list(p.badges);
        if(badgeList.length) badges.append(...badgeList.map(b => el('span', { class: 'pill' }, b)));
        else badges.remove();

        const facts = document.getElementById('quick-facts');
        const factList = list(p.quick_facts);
        if(factList.length) facts.append(...factList.map(f => el('div', {}, el('dt', {}, f.label), el('dd', {}, f.value))));
        else facts.remove();

        // Hero title with the highlighted phrase in accent colour
        const title = document.getElementById('hero-title');
        const text = p.hero_title || '';
        const hl = p.hero_highlight || '';
        const at = hl ? text.indexOf(hl) : -1;
        if(at >= 0){
          title.append(text.slice(0, at), el('span', { class: 'accent' }, hl), text.slice(at + hl.length));
        } else {
          title.textContent = text;
        }

        document.getElementById('hero-facts').append(
          ...list(p.hero_facts).map(f => el('span', {}, el('strong', {}, f.label), ' ' + f.value))
        );

        const hobbies = (p.hobbies || '').trim();
        if(hobbies){
          const note = document.getElementById('hobbies');
          note.textContent = hobbies;
          note.hidden = false;
        }

        document.getElementById('contact-list').append(...contactButtons(p));
      }

      function renderCase(c){
        const stat = statFor(c);

        let statBlock;
        if(c.impact){
          statBlock = el('div', { class: 'case-stat' },
            stat ? el('div', { class: stat.length > 4 ? 'num num-long' : 'num' }, stat) : null,
            el('div', { class: 'txt' }, c.impact)
          );
        } else {
          statBlock = el('div', { class: 'case-stat pending' },
            el('div', { class: 'txt' }, window.Site.isOngoing(c) ? 'In progress: results to follow.' : c.outcome || '')
          );
        }

        const card = el('article', { class: 'case' },
          el('div', {},
            caseMeta(c),
            el('h3', { class: 'case-title' }, el('a', { class: 'case-link', href: caseUrl(c) }, c.title)),
            el('p', { class: 'case-summary' }, c.summary),
            c.context ? el('p', { class: 'case-context' }, c.context) : null,
            el('div', { class: 'case-tags' }, list(c.tags).map(t => el('span', { class: 'pill' }, t))),
            el('span', { class: 'case-more', 'aria-hidden': 'true' }, 'Read full case study', icon(ICONS.right))
          ),
          statBlock
        );
        return card;
      }

      function renderWork(cases, jobs){
        // Featured cards; if none are switched on, show the first three so the section is never empty
        let featured = cases.filter(c => c.featured);
        if(!featured.length) featured = cases.slice(0, 3);
        document.getElementById('feed').append(...featured.map(renderCase));

        // Experience rows, each listing the case studies whose Company matches the job
        const sameCompany = (a, b) => (a || '').trim().toLowerCase() === (b || '').trim().toLowerCase();
        document.getElementById('job-list').append(...list(jobs).map(j => {
          const projects = cases.filter(c => sameCompany(c.company, j.company));
          return el('li', { class: 'job' },
            el('div', { class: 'job-period' }, j.period),
            el('div', { class: 'job-main' },
              el('div', { class: 'job-head' },
                logoTile({ company: j.company, company_logo: j.logo }),
                el('div', {},
                  el('h3', { class: 'job-role' }, j.role),
                  el('div', { class: 'job-company' }, j.company)
                )
              ),
              j.summary ? el('p', { class: 'job-summary' }, j.summary) : null,
              projects.length ? el('ul', { class: 'job-projects' }, projects.map(c =>
                el('li', {}, el('a', { href: caseUrl(c) }, c.title, icon(ICONS.right)))
              )) : null
            )
          );
        }));
      }

      function renderSkills(s){
        document.getElementById('capability-list').append(
          ...list(s.capabilities).map((c, i) => el('div', { class: 'cap' },
            el('div', { class: 'cap-num' }, String(i + 1).padStart(2, '0')),
            el('div', {}, el('h3', {}, c.title), el('p', {}, c.text))
          ))
        );
      }

      load('content/profile.json').then(renderProfile).catch(err => showError('hero-facts', err));
      // Experience is optional: if it fails to load, the featured cards still show
      Promise.all([
        load('content/case-studies.json'),
        load('content/experience.json').catch(err => { console.error(err); return { jobs: [] }; })
      ]).then(([data, exp]) => {
        const jobs = list(exp.jobs);
        renderWork(withJobLogos(list(data.cases), jobs), jobs);
      }).catch(err => showError('feed', err));
      load('content/skills.json').then(renderSkills).catch(err => showError('capability-list', err));
    })();
  </script>

  <!-- Visitor statistics (GoatCounter, cookie-free): https://branimir.goatcounter.com -->
  <script data-goatcounter="https://branimir.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
