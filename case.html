<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Case study | Branimir Stančerić</title>
  <meta name="description" content="Case study by Branimir Stančerić, Delivery Manager and IT Project Manager." />
  <meta property="og:image" content="https://branimirstanceric.github.io/cv/assets/profile.jpg" />

  <!-- Apply the saved or system theme before first paint -->
  <script>
    (function(){
      var t = null;
      try { t = localStorage.getItem('theme'); } catch(e) {}
      if(t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Bump ?v= whenever style.css or common.js changes, so browsers don't mix old and new files -->
  <link rel="stylesheet" href="style.css?v=10" />
</head>

<body>
  <!--
    One template for every case study: case.html?id=<page link>.
    The content comes from content/case-studies.json (edit it in Pages CMS).
  -->
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html" data-field="name">Branimir Stančerić</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="index.html#cases">Work</a>
        <a href="index.html#capabilities">Capabilities</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch light or dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="container" id="case"></div>

    <!-- Contact -->
    <div class="container">
      <section class="contact" id="contact">
        <div>
          <div class="eyebrow">Contact</div>
          <h2 class="section-title">Let's talk about your next delivery.</h2>
          <p data-field="contact_intro"></p>
        </div>
        <div class="contact-links" id="contact-list"></div>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">Copyright © <span id="year"></span> <span data-field="name"></span>. All rights reserved.</div>
  </footer>

  <script src="common.js?v=10"></script>
  <script>
    (function(){
      const { el, icon, ICONS, list, statOf, caseId, caseUrl, caseMeta, load, fillFields, contactButtons, showError, asset } = window.Site;
      const root = document.getElementById('case');
      const wanted = new URLSearchParams(location.search).get('id') || '';
      let ownerName = '';

      function section(title, ...content){
        const body = content.flat().filter(Boolean);
        if(!body.length) return null;
        return el('section', { class: 'cs-section' }, el('h2', {}, title), ...body);
      }

      function bullets(items){
        const xs = list(items);
        return xs.length ? el('ul', { class: 'cs-list' }, xs.map(x => el('li', {}, x))) : null;
      }

      function para(text){
        // Blank lines in a text field become separate paragraphs
        return (text || '').split(/\n\s*\n/).map(s => s.trim()).filter(Boolean).map(s => el('p', {}, s));
      }

      function renderNotFound(){
        document.title = 'Case study not found' + (ownerName ? ' | ' + ownerName : '');
        root.append(el('div', { class: 'not-found' },
          el('h1', { class: 'cs-title' }, 'Case study not found'),
          el('p', {}, 'This link may be outdated. All case studies are listed on the main page.'),
          el('a', { class: 'btn primary', href: 'index.html#cases' }, 'See all case studies')
        ));
      }

      function renderCase(cases, index){
        const c = cases[index];
        const stat = statOf(c.impact);

        document.title = c.title + (ownerName ? ' | ' + ownerName : '');
        if(c.summary) document.querySelector('meta[name="description"]').setAttribute('content', c.summary);

        const head = el('header', { class: 'cs-head' },
          caseMeta(c),
          el('h1', { class: 'cs-title' }, c.title),
          c.summary ? el('p', { class: 'cs-lead' }, c.summary) : null,
          el('div', { class: 'case-tags' }, list(c.tags).map(t => el('span', { class: 'pill' }, t)))
        );

        const result = c.impact ? el('div', { class: 'cs-result' },
          stat ? el('div', { class: 'num' }, stat) : null,
          el('div', {}, el('div', { class: 'label' }, 'Key result'), el('div', { class: 'txt' }, c.impact))
        ) : null;

        const phases = list(c.phases).map((ph, i) => el('div', { class: 'phase' },
          el('h3', {}, el('span', { class: 'phase-num' }, String(i + 1).padStart(2, '0')), ph.title),
          bullets(ph.points)
        ));

        const images = list(c.images).filter(im => im.image).map(im => el('figure', {},
          el('img', { src: asset(im.image), alt: im.caption || c.title, loading: 'lazy' }),
          im.caption ? el('figcaption', {}, im.caption) : null
        ));

        const main = el('div', { class: 'cs-main' },
          section('The challenge', para(c.problem)),
          section('Why it mattered', para(c.why)),
          section('What I did', para(c.approach), phases),
          section('Results', bullets(c.results), para(c.outcome)),
          section('Lessons learned', para(c.lessons)),
          images.length ? el('div', { class: 'gallery' }, images) : null
        );

        const roles = list(c.my_role);
        const contextPoints = list(c.context_points);
        const aside = el('aside', { class: 'cs-aside', 'aria-label': 'Project details' },
          roles.length ? el('div', {}, el('h4', {}, 'My role'), bullets(roles)) : null,
          (c.context || contextPoints.length) ? el('div', {}, el('h4', {}, 'Context'), c.context ? el('p', {}, c.context) : null, bullets(contextPoints)) : null,
          list(c.categories).length ? el('div', {}, el('h4', {}, 'Areas'), el('div', { class: 'case-tags' }, list(c.categories).map(t => el('span', { class: 'pill' }, t)))) : null
        );

        const prev = cases[index - 1];
        const next = cases[index + 1];
        const pager = el('nav', { class: 'cs-pager', 'aria-label': 'More case studies' },
          prev ? el('a', { href: caseUrl(prev) }, el('div', { class: 'dir' }, '← Previous'), el('div', { class: 'name' }, prev.title)) : null,
          next ? el('a', { class: 'next', href: caseUrl(next) }, el('div', { class: 'dir' }, 'Next →'), el('div', { class: 'name' }, next.title)) : null
        );

        root.append(...[
          el('a', { class: 'back', href: 'index.html#cases' }, icon(ICONS.left), 'All case studies'),
          head,
          result,
          el('div', { class: 'cs-grid' }, main, aside.childElementCount ? aside : null),
          pager
        ].filter(Boolean));
      }

      const profile = load('content/profile.json').then(p => {
        ownerName = p.name || '';
        fillFields(p);
        document.getElementById('contact-list').append(...contactButtons(p));
      }).catch(err => showError('contact-list', err));

      const cases = load('content/case-studies.json');

      Promise.all([cases, profile]).then(([data]) => {
        const all = list(data.cases);
        const target = caseId({ id: wanted });
        const index = target ? all.findIndex(c => caseId(c) === target) : -1;
        if(index < 0) renderNotFound();
        else renderCase(all, index);
      }).catch(err => showError('case', err));
    })();
  </script>
</body>
</html>
