# Pages CMS configuration: https://pagescms.org/docs/configuration/
# Defines the editing forms at app.pagescms.org for this site.

media:
  input: assets
  output: assets

content:
  - name: profile
    label: Profile & intro
    type: file
    path: content/profile.json
    format: json
    fields:
      - { name: name, label: Full name, type: string, required: true }
      - { name: headline, label: Job title (not shown on the site), type: string }
      - { name: short_bio, label: Short bio (not shown on the site), type: text }
      - { name: photo, label: Profile photo, type: image, description: "Not shown on the site. Link previews use assets/og-card.jpg." }
      - name: hero_background
        label: Intro background photo
        type: image
        description: "Full-width photo behind the intro. A wide (landscape) photo works best, about 1600 px wide and under 300 KB. The left side is darkened for the text."
      - { name: cv_file, label: CV file (PDF), type: file }
      - name: status_line
        label: Job title above the headline
        type: string
        description: "Separate the parts with | so the title only wraps there. The same title is also written in index.html and on the preview card; ask for those to be updated when it changes."
      - { name: hero_title, label: Main headline, type: text }
      - name: hero_highlight
        label: Highlighted words in the headline
        description: Must match words in the main headline exactly; they are shown in the accent colour.
        type: string
      - { name: hero_intro, label: Intro paragraph, type: text }
      - name: hobbies
        label: Hobbies (small text under the intro)
        type: text
        description: "One or two short sentences, shown in smaller grey text below the intro paragraph. Leave empty to hide it."
      - name: hero_facts
        label: Facts under the intro
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: value, label: Value, type: string }
      - { name: contact_intro, label: Contact section text, type: text }
      - { name: email, label: Email, type: string }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: github, label: GitHub URL, type: string }

  - name: case_studies
    label: Work (projects)
    type: file
    path: content/case-studies.json
    format: json
    fields:
      - name: cases
        label: Projects
        description: Shown on the Work page in this order. Drag to reorder. Each project also gets its own page.
        type: object
        list: true
        fields:
          # Card on the Work page
          - { name: title, label: Title, type: string, required: true }
          - name: id
            label: Page link
            type: string
            description: "Short name for this project's own page, e.g. uniqa-warranty-automation → case.html?id=uniqa-warranty-automation. Changing it breaks links you already shared. Leave empty to use the title."
          - { name: summary, label: One-line summary, type: string }
          - name: featured
            label: Selected work
            type: boolean
            description: "On: shown as a large card at the top of the Work page. Off: shown in the compact list. Four or five works best."
          - name: company
            label: Company / client
            type: string
            description: "Write it exactly as in Company logos (e.g. K2-18b) to use that company's logo."
          - name: company_logo
            label: Company logo
            type: image
            description: "Optional. Leave empty to use the logo from Company logos. A logo cropped close to its edges reads best at small size."
          - { name: period, label: Period, type: string, description: "e.g. Nov 2024 to Feb 2025. Include the word 'ongoing' to show the green Ongoing label." }
          - { name: context, label: Context (one line), type: string, description: "Optional, e.g. Team of 8 · SAP Commerce · 3 markets" }
          - { name: impact, label: Key result, type: string, description: "Optional. Only a result that was really measured. Leave empty when there is no measured number." }
          - name: stat
            label: Big number (optional)
            type: string
            description: "Only needed when the Key result has no % in it, e.g. 5 markets. Leave empty when there is no measured number."
          - { name: tags, label: Tags (shown on the card), type: string, list: true }

          # The project's own page
          - { name: problem, label: The challenge, type: text, description: "What was wrong or needed. Leave a blank line between paragraphs." }
          - { name: why, label: Why it mattered, type: text, description: "Optional. Business impact of the problem: cost, customers, deadlines, risk." }
          - name: context_points
            label: Context details
            type: string
            list: true
            description: "Optional. One fact per item: team size, tech stack, markets, budget, constraints."
          - { name: approach, label: What I did (overview), type: text }
          - name: phases
            label: What I did (phases)
            type: object
            list: true
            description: "Optional. Break the work into steps, e.g. Discovery, Integration build, UAT and go-live."
            fields:
              - { name: title, label: Phase title, type: string }
              - { name: points, label: What happened, type: string, list: true }
          - { name: results, label: Results, type: string, list: true, description: "Optional. One result per item. No estimated or invented numbers." }
          - { name: outcome, label: Outcome summary, type: text }
          - { name: lessons, label: Lessons learned, type: text, description: "Optional. What you would repeat or do differently." }
          - { name: my_role, label: My role, type: string, list: true }
          - name: images
            label: Images
            type: object
            list: true
            description: "Optional. Diagrams, timelines, screenshots. Avoid confidential client material."
            fields:
              - { name: image, label: Image, type: image }
              - { name: caption, label: Caption, type: string }
          - name: categories
            label: Areas
            description: "Shown as Areas on the project's own page and used as the filter buttons on the Work page. Spell an area the same way on every project, e.g. eCommerce, Integrations, Compliance, Logistics, Fintech and Payments, Migration."
            type: string
            list: true

  # Jobs are no longer shown on the site; this list now only supplies each company's logo to its projects.
  - name: experience
    label: Company logos
    type: file
    path: content/experience.json
    format: json
    fields:
      - name: jobs
        label: Companies
        description: Upload each company's logo once; every project with the same Company uses it.
        type: object
        list: true
        fields:
          - { name: company, label: Company, type: string, required: true }
          - { name: logo, label: Company logo, type: image, description: "A logo cropped close to its edges reads best at small size. White logos need their own dark background." }
          - { name: role, label: Role (not shown), type: string }
          - { name: period, label: Period (not shown), type: string }
          - { name: summary, label: One-line summary (not shown), type: string }

  - name: skills
    label: Capabilities
    type: file
    path: content/skills.json
    format: json
    fields:
      - name: capabilities
        label: Capabilities
        description: "These texts are also written in index.html for search engines; ask for that copy to be updated when you change them."
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Description, type: text }
